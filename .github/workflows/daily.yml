name: RecSys Daily

"on":
  schedule:
    - cron: "33 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recsys-daily
  cancel-in-progress: false

env:
  IMAGE_TAG: recsys-daily-${{ github.run_id }}

jobs:
  collect_filter:
    name: Collect and filter candidates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Require the default branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: pipeline/Dockerfile
          target: pipeline
          tags: ${{ env.IMAGE_TAG }}-pipeline
          load: true
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,mode=max,scope=pipeline
      - name: Collect and filter
        env:
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p stage-1 data
          docker run --rm \
            -e DEEPSEEK_BASE_URL -e DEEPSEEK_API_KEY \
            -v "$PWD/stage-1:/workspace/stage-1" \
            -v "$PWD/data:/workspace/data:ro" \
            "${IMAGE_TAG}-pipeline" collect-filter --output /workspace/stage-1 --root /workspace
      - uses: actions/upload-artifact@v4
        with:
          name: stage-1-${{ github.run_id }}
          path: stage-1
          if-no-files-found: error
          retention-days: 1

  deep_read:
    name: Deep read (${{ matrix.kind }})
    needs: collect_filter
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 2
      matrix:
        kind: [paper, blog]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stage-1-${{ github.run_id }}
          path: stage-1
      - uses: docker/setup-buildx-action@v3
      - name: Build pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: pipeline/Dockerfile
          target: pipeline
          tags: ${{ env.IMAGE_TAG }}-pipeline
          load: true
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,mode=max,scope=pipeline
      - name: Deep read selected kind
        env:
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINERU_API_KEY: ${{ secrets.MINERU_API_KEY }}
        run: |
          mkdir -p "deep-reading-${{ matrix.kind }}"
          docker run --rm \
            -e DEEPSEEK_BASE_URL -e DEEPSEEK_API_KEY \
            -e MINERU_API_KEY \
            -v "$PWD/stage-1:/workspace/stage-1:ro" \
            -v "$PWD/deep-reading-${{ matrix.kind }}:/workspace/deep-reading" \
            "${IMAGE_TAG}-pipeline" deep-read --kind "${{ matrix.kind }}" --input /workspace/stage-1 --output /workspace/deep-reading --root /workspace
      - uses: actions/upload-artifact@v4
        with:
          name: deep-reading-${{ matrix.kind }}-${{ github.run_id }}
          path: deep-reading-${{ matrix.kind }}
          if-no-files-found: error
          retention-days: 1

  similarity:
    name: Compute semantic similarity
    needs: [collect_filter, deep_read]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stage-1-${{ github.run_id }}
          path: stages/stage-1
      - uses: actions/download-artifact@v4
        with:
          name: deep-reading-paper-${{ github.run_id }}
          path: stages/deep-reading-paper
      - uses: actions/download-artifact@v4
        with:
          name: deep-reading-blog-${{ github.run_id }}
          path: stages/deep-reading-blog
      - uses: docker/setup-buildx-action@v3
      - name: Build similarity image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: pipeline/Dockerfile
          target: similarity
          tags: ${{ env.IMAGE_TAG }}-similarity
          load: true
          cache-from: type=gha,scope=pipeline-similarity
          cache-to: type=gha,mode=max,scope=pipeline-similarity
      - name: Restore FastEmbed model cache
        id: fastembed-cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: fastembed-cache
          key: "fastembed|0.8.0|sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2|384"
      - name: Compute semantic similarity
        env:
          FASTEMBED_CACHE_PATH: /workspace/cache/fastembed
        run: |
          mkdir -p similarity-work fastembed-cache
          echo "FastEmbed cache hit: ${{ steps.fastembed-cache.outputs.cache-hit }}"
          docker run --rm \
            -e FASTEMBED_CACHE_PATH \
            -v "$PWD/stages:/workspace/stages:ro" \
            -v "$PWD/data:/workspace/data:ro" \
            -v "$PWD/similarity-work:/workspace/similarity-work" \
            -v "$PWD/fastembed-cache:/workspace/cache/fastembed" \
            "${IMAGE_TAG}-similarity" similarity --input /workspace/stages --output /workspace/similarity-work/similarity --root /workspace
          test -f similarity-work/similarity/manifest.json
          test -f similarity-work/similarity/similarity.json
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-${{ github.run_id }}
          path: similarity-work/similarity
          if-no-files-found: error
          retention-days: 3

  rank_integrate:
    name: Rank and integrate publish bundle
    needs: [collect_filter, deep_read, similarity]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stage-1-${{ github.run_id }}
          path: stages/stage-1
      - uses: actions/download-artifact@v4
        with:
          name: deep-reading-paper-${{ github.run_id }}
          path: stages/deep-reading-paper
      - uses: actions/download-artifact@v4
        with:
          name: deep-reading-blog-${{ github.run_id }}
          path: stages/deep-reading-blog
      - uses: actions/download-artifact@v4
        with:
          name: similarity-${{ github.run_id }}
          path: stages/similarity
      - uses: docker/setup-buildx-action@v3
      - name: Build pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: pipeline/Dockerfile
          target: pipeline
          tags: ${{ env.IMAGE_TAG }}-pipeline
          load: true
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,mode=max,scope=pipeline
      - name: Rank and integrate
        run: |
          mkdir -p publish-work data
          docker run --rm \
            -v "$PWD/stages:/workspace/stages:ro" \
            -v "$PWD/publish-work:/workspace/publish-work" \
            -v "$PWD/data:/workspace/data:ro" \
            "${IMAGE_TAG}-pipeline" rank-integrate --input /workspace/stages --output /workspace/publish-work/publish-bundle --root /workspace
      - name: Validate publish bundle manifest
        run: |
          test "$(find publish-work/publish-bundle -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')" = "manifest.json pending-data taxonomy.json "
          python -c 'import json; m=json.load(open("publish-work/publish-bundle/manifest.json")); assert m["run_id"], m'
      - uses: actions/upload-artifact@v4
        with:
          name: publish-bundle-${{ github.run_id }}
          path: publish-work/publish-bundle
          if-no-files-found: error
          retention-days: 3

  build_deploy:
    name: Build, deploy Pages, and promote data
    needs: [rank_integrate, similarity]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: publish-bundle-${{ github.run_id }}
          path: publish-bundle
      - uses: actions/download-artifact@v4
        with:
          name: similarity-${{ github.run_id }}
          path: similarity
      - uses: docker/setup-buildx-action@v3
      - name: Build site image
        uses: docker/build-push-action@v6
        with:
          context: site
          file: site/Dockerfile
          tags: ${{ env.IMAGE_TAG }}-site
          load: true
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site
      - name: Validate paired manifests
        run: python -c 'import json; b=json.load(open("publish-bundle/manifest.json")); sm=json.load(open("similarity/manifest.json")); s=json.load(open("similarity/similarity.json")); assert b["run_id"] and b["schema_version"] == "1" and sm == b and s["run_id"] == b["run_id"] and s["schema_version"] == b["schema_version"], (b, sm)'
      - name: Build Astro and Pagefind output
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          SIMILARITY_ARTIFACT_PATH: /workspace/similarity/similarity.json
        run: |
          test -n "$SITE_ORIGIN"
          mkdir -p pages-dist
          docker run --rm \
            -e SITE_ORIGIN \
            -e SIMILARITY_ARTIFACT_PATH \
            -v "$PWD/publish-bundle:/workspace/publish-bundle:ro" \
            -v "$PWD/similarity:/workspace/similarity:ro" \
            -v "$PWD/pages-dist:/workspace/site/dist" \
            "${IMAGE_TAG}-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Promote pending data after deployment
        run: |
          test -f publish-bundle/pending-data/state.json
          mkdir -p data
          rsync --archive --delete publish-bundle/pending-data/ data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "data: publish daily recommendation bundle"
            git push origin HEAD:main
          fi
