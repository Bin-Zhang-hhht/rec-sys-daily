name: Deploy site only

"on":
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: recsys-daily
  cancel-in-progress: false

env:
  IMAGE_TAG: recsys-site-only-${{ github.run_id }}

jobs:
  build_deploy:
    name: Build and deploy the current site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the default branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Site-only deployment must run from main."
          exit 1
      - name: Find the latest reusable publish bundle
        id: bundle
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "daily.yml",
              branch: "main",
              status: "success",
              per_page: 20,
            });

            for (const run of data.workflow_runs) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { owner, repo, run_id: run.id, per_page: 100 },
              );
              const expectedName = `publish-bundle-${run.id}`;
              const artifact = artifacts.find(
                candidate => candidate.name === expectedName && !candidate.expired,
              );
              if (artifact) {
                core.info(`Using ${artifact.name} from daily run ${run.id}.`);
                core.setOutput("artifact_name", artifact.name);
                core.setOutput("run_id", String(run.id));
                return;
              }
            }

            core.setFailed(
              "No unexpired publish bundle was found in the latest successful daily runs. Run RecSys Daily first.",
            );
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download the publish bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: publish-bundle
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.bundle.outputs.run_id }}
      - uses: docker/setup-buildx-action@v3
      - name: Build site image
        uses: docker/build-push-action@v6
        with:
          context: site
          file: site/Dockerfile
          tags: ${{ env.IMAGE_TAG }}
          load: true
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site
      - name: Validate downloaded publish bundle
        run: |
          test "$(find publish-bundle -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')" = "manifest.json pending-data taxonomy.json "
          python -c 'import json; m=json.load(open("publish-bundle/manifest.json")); assert m["run_id"] and m["schema_version"] == "1", m'
      - name: Build Astro and Pagefind output
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          test -n "$SITE_ORIGIN"
          mkdir -p pages-dist
          docker run --rm \
            -e SITE_ORIGIN \
            -v "$PWD/publish-bundle:/workspace/publish-bundle:ro" \
            -v "$PWD/pages-dist:/workspace/site/dist" \
            "${IMAGE_TAG}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
