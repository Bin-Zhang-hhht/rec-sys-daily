models:
  text:
    active_profile: nvidia_super
    profiles:
      nvidia_super:
        base_url_env: NVIDIA_BASE_URL
        api_key_env: NVIDIA_API_KEY
        model: nvidia/nemotron-3-super-120b-a12b
        context_window_tokens: 1000000
      nvidia_ultra:
        base_url_env: NVIDIA_BASE_URL
        api_key_env: NVIDIA_API_KEY
        model: nvidia/nemotron-3-ultra-550b-a55b
        context_window_tokens: 1000000
      deepseek_v4_flash:
        base_url_env: DEEPSEEK_BASE_URL
        api_key_env: DEEPSEEK_API_KEY
        model: deepseek-v4-flash
        context_window_tokens: 1000000
    reserved_prompt_tokens: 8000
    reserved_output_tokens: 16000
    batch_size: 8
  vision:
    profile: nvidia_omni
    invoke_url_env: NVIDIA_VLM_INVOKE_URL
    api_key_env: NVIDIA_API_KEY
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    context_window_tokens: 262144
    max_requests_per_paper: 1
    include_all_detected_key_pages: true
    request_defaults:
      max_tokens: 65536
      reasoning_budget: 16384
      stream: false
      temperature: 0.6
      top_p: 0.95
  common:
    concurrency_per_worker: 1
    timeout_seconds: 600
    retries: 3
  mineru:
    api_key_env: MINERU_API_KEY
    base_url: https://mineru.net/api/v4
    model_version: vlm
    upload_timeout_seconds: 120
    poll_timeout_seconds: 900
    poll_interval_seconds: 5
    max_pdf_bytes: 20971520
    max_pdf_pages: 200
