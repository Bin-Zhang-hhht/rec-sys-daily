daily_target: 10
minimum_final_score: 0.50
minimum_metadata_relevance_score: 0.65
request_user_agent: RecSysDaily/1.0
structured_analysis_min_success_rate: 0.80
metadata_weights:
  topic_relevance: 0.30
  scenario_relevance: 0.25
  source_quality: 0.15
  novelty: 0.15
  practical_value: 0.10
  recency: 0.05
final_weights:
  metadata_score: 0.55
  evidence_quality: 0.20
  business_transferability: 0.15
  technical_depth: 0.10
limits:
  http_concurrency: 2
  arxiv_min_interval_seconds: 3
  request_timeout_seconds: 45
  retry_attempts: 3
  retry_backoff_seconds: 1
  retry_max_delay_seconds: 30
  max_papers_per_run: 100
  max_blogs_per_run: 50
  deep_reading_candidates_per_type: 20
  pdf_download_concurrency: 1
  blog_download_concurrency_per_domain: 1
  blog_min_interval_seconds_per_domain: 2
  max_blog_html_bytes: 5242880
graph_initial_content_nodes: 180
graph_shard_target_bytes: 98304
similarity:
  library: fastembed
  version: 0.8.0
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  dimension: 384
  max_input_tokens: 128
  title_tokens: 32
  abstract_tokens: 64
  summary_tokens: 24
  separator_tokens: 8
  batch_size: 32
  threads: 2
  block_size: 64
  top_k: 5
  min_cosine: 0.72
  mutual_top_k: true
  score_decimals: 6
storage:
  target_item_bytes: 16384
  max_item_bytes: 32768
  max_blog_excerpt_chars: 4000
  warn_repository_data_mb: 500
  warn_pages_artifact_mb: 500
  fail_pages_artifact_mb: 900
