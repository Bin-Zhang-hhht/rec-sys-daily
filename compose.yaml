services:
  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - ./work:/workspace/work
    entrypoint: ["python", "-m", "recsys_daily"]

  site:
    build:
      context: ./site
    environment:
      PUBLISH_BUNDLE_DIR: /workspace/work/publish-bundle
      SITE_ORIGIN: ${SITE_ORIGIN:-https://example.invalid}
    volumes:
      - ./work:/workspace/work:ro
    entrypoint: ["pnpm"]
