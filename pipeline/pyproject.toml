[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-daily"
version = "0.1.0"
description = "Daily recommendation-systems research pipeline"
requires-python = ">=3.12"
dependencies = [
    "feedparser",
    "openai",
    "pypdf",
    "pydantic>=2",
    "PyMuPDF",
    "python-dateutil",
    "PyYAML",
    "requests",
    "trafilatura",
    "typer",
]

[project.optional-dependencies]
dev = ["jsonschema", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["recsys_daily*"]
